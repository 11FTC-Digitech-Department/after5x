<ion-header>
  <ion-toolbar>
    <ion-title>Admin Dashboard</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-grid>
    <ion-row>
      <ion-col size="12">
        <h2>Welcome to Admin Panel</h2>
        <p>Manage users, view analytics, and configure system settings.</p>
      </ion-col>
    </ion-row>

    <ion-row>
      <ion-col size="12" size-md="4">
        <ion-card>
          <ion-card-header>
            <ion-card-title>
              <ion-icon name="people-outline" slot="start"></ion-icon>
              Total Users
            </ion-card-title>
          </ion-card-header>
          <ion-card-content>
            <h3>1,234</h3>
            <p>+12% from last month</p>
          </ion-card-content>
        </ion-card>
      </ion-col>

      <ion-col size="12" size-md="4">
        <ion-card>
          <ion-card-header>
            <ion-card-title>
              <ion-icon name="business-outline" slot="start"></ion-icon>
              Active Providers
            </ion-card-title>
          </ion-card-header>
          <ion-card-content>
            <h3>89</h3>
            <p>+5% from last month</p>
          </ion-card-content>
        </ion-card>
      </ion-col>

      <ion-col size="12" size-md="4">
        <ion-card>
          <ion-card-header>
            <ion-card-title>
              <ion-icon name="stats-chart-outline" slot="start"></ion-icon>
              Total Bookings
            </ion-card-title>
          </ion-card-header>
          <ion-card-content>
            <h3>5,678</h3>
            <p>+18% from last month</p>
          </ion-card-content>
        </ion-card>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
