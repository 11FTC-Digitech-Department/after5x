<ion-header>
  <ion-toolbar>
    <ion-title>Dashboard</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-grid fixed class="ion-no-padding">
    <ion-row>
      <ion-col size="12">
        <div style="padding: 20px;">
          <h2>Provider Dashboard</h2>

          <ion-grid>
            <ion-row>
              <ion-col size="6">
                <ion-card>
                  <ion-card-header>
                    <ion-card-title>Today's Jobs</ion-card-title>
                  </ion-card-header>
                  <ion-card-content>
                    <h1>5</h1>
                  </ion-card-content>
                </ion-card>
              </ion-col>

              <ion-col size="6">
                <ion-card>
                  <ion-card-header>
                    <ion-card-title>Earnings</ion-card-title>
                  </ion-card-header>
                  <ion-card-content>
                    <h1>$250</h1>
                  </ion-card-content>
                </ion-card>
              </ion-col>
            </ion-row>
          </ion-grid>

          <ion-button expand="block" routerLink="/p/schedule" style="margin-top: 20px;">
            View Schedule
          </ion-button>
        </div>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
