<h1 class="welcome-text">Welcome back!</h1>

<ion-item class="form-field">
  <ion-input
    label="Email"
    label-placement="stacked"
    type="email"
    [(ngModel)]="loginForm.email"
    placeholder="Enter your email"
  ></ion-input>
</ion-item>

          <ion-item class="form-field">
            <ion-input
              label="Password"
              label-placement="stacked"
              [type]="isPasswordVisible ? 'text' : 'password'"
              [(ngModel)]="loginForm.password"
              placeholder="Enter your password"
            ></ion-input>
            <ion-button
              fill="clear"
              slot="end"
              (click)="togglePasswordVisibility()"
              class="password-toggle-btn"
            >
              <ion-icon
                [name]="isPasswordVisible ? 'eye-off' : 'eye'"
                color="medium"
              ></ion-icon>
            </ion-button>
          </ion-item>

<div class="forgot-password">
  <ion-text color="primary" (click)="onForgotPassword()">
    Forgot password?
  </ion-text>
</div>

<ion-button
  expand="block"
  size="large"
  class="login-button"
  [disabled]="isLoading()"
  (click)="onLogin()"
>
  @if (isLoading()) {
    <ion-spinner name="crescent" slot="start"></ion-spinner>
    Signing in...
  } @else {
    Login
  }
</ion-button>

<ion-row class="social-login">
  <ion-col size="6">
    <ion-button
      fill="outline"
      size="large"
      class="social-button facebook-button"
      [disabled]="isLoading()"
      (click)="onFacebookLogin()"
    >
      @if (isLoading()) {
        <ion-spinner name="crescent" slot="start"></ion-spinner>
      } @else {
        <ion-icon slot="start" name="logo-facebook"></ion-icon>
      }
      Facebook
    </ion-button>
  </ion-col>

  <ion-col size="6">
    <ion-button
      fill="outline"
      size="large"
      class="social-button google-button"
      [disabled]="isLoading()"
      (click)="onGoogleLogin()"
    >
      @if (isLoading()) {
        <ion-spinner name="crescent" slot="start"></ion-spinner>
      } @else {
        <ion-icon slot="start" name="logo-google"></ion-icon>
      }
      Google
    </ion-button>
  </ion-col>
</ion-row>
