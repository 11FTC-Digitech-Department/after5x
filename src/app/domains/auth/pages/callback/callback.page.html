<ion-content class="callback-content">
  <div class="callback-container">
    <div class="loading-section">
      @if (isProcessing()) {
        <ion-spinner name="crescent" color="primary"></ion-spinner>
      }
      <ion-text>
        <h2>{{ statusMessage() }}</h2>
        @if (isProcessing()) {
          <p>Please wait while we process your authentication...</p>
        }
      </ion-text>
    </div>
  </div>
</ion-content>
