<ion-content [fullscreen]="true" scroll-y="false">
  <ion-grid fixed class="ion-no-padding">
    <ion-row class="full-height ion-align-items-center">
      <ion-col size="12">
        <div class="auth-container">
          <!-- Auth Segment -->
          <ion-segment
            [value]="selectedSegment()"
            (ionChange)="segmentChanged($event)"
            class="auth-segment"
          >
            <ion-segment-button value="login">
              <ion-label>Login</ion-label>
            </ion-segment-button>
            <ion-segment-button value="signup">
              <ion-label>Sign Up</ion-label>
            </ion-segment-button>
          </ion-segment>

          <!-- Login Form -->
          @if (selectedSegment() === 'login') {
          <app-login-form
            [isLoading]="isLoginLoading()"
            (login)="onLogin($event)"
            (facebookLogin)="onFacebookLogin()"
            (googleLogin)="onGoogleLogin()"
            (forgotPassword)="navigateToForgotPassword()"
          ></app-login-form>
          }

          <!-- Sign Up Form -->
          @if (selectedSegment() === 'signup') {
          <app-signup-form
            [isLoading]="isSignupLoading()"
            (signup)="onSignup($event)"
            (facebookLogin)="onFacebookLogin()"
            (googleLogin)="onGoogleLogin()"
          ></app-signup-form>
          }
        </div>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
