<ion-header>
  <ion-toolbar>
    <ion-title>Services</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-grid fixed class="ion-no-padding">
    <ion-row>
      <ion-col size="12">
        <div style="padding: 20px;">
          <h2>Our Services</h2>
          <p>Browse our comprehensive range of home services</p>

          <ion-list>
            <ion-item button routerLink="/c/service-details/1">
              <ion-label>
                <h3>Plumbing Services</h3>
                <p>Professional plumbing repairs and installations</p>
              </ion-label>
              <ion-icon name="chevron-forward" slot="end"></ion-icon>
            </ion-item>

            <ion-item button routerLink="/c/service-details/2">
              <ion-label>
                <h3>Electrical Services</h3>
                <p>Safe and reliable electrical work</p>
              </ion-label>
              <ion-icon name="chevron-forward" slot="end"></ion-icon>
            </ion-item>

            <ion-item button routerLink="/c/service-details/3">
              <ion-label>
                <h3>Cleaning Services</h3>
                <p>Professional cleaning for your home</p>
              </ion-label>
              <ion-icon name="chevron-forward" slot="end"></ion-icon>
            </ion-item>
          </ion-list>
        </div>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
