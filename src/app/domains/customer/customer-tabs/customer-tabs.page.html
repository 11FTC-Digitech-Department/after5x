<ion-header>
  <ion-toolbar>
    <ion-title>Customer</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-tabs>
    <ion-router-outlet></ion-router-outlet>
    <ion-tab-bar slot="bottom">
      <ion-tab-button tab="home" href="/c/home">
        <ion-icon name="home"></ion-icon>
        <ion-label>Home</ion-label>
      </ion-tab-button>

      <ion-tab-button tab="catalog" href="/c/catalog">
        <ion-icon name="list"></ion-icon>
        <ion-label>Services</ion-label>
      </ion-tab-button>

      <ion-tab-button tab="activity" href="/c/activity">
        <ion-icon name="time"></ion-icon>
        <ion-label>Activity</ion-label>
      </ion-tab-button>

      <ion-tab-button tab="messages" href="/c/messages">
        <ion-icon name="chatbubbles"></ion-icon>
        <ion-label>Messages</ion-label>
      </ion-tab-button>

      <ion-tab-button tab="profile" href="/c/profile">
        <ion-icon name="person"></ion-icon>
        <ion-label>Profile</ion-label>
      </ion-tab-button>
    </ion-tab-bar>
  </ion-tabs>
</ion-content>
