  @if (isAuthenticated()) {
    <app-promotion-story-modal />
  }
  <ion-tabs>
    <ion-tab-bar slot="bottom">
      <ion-tab-button tab="home" [class.guest-tab]="isGuest()">
        <ion-icon name="home-outline"></ion-icon>
        <ion-label>Home</ion-label>
      </ion-tab-button>

      <ion-tab-button
        tab="bookings"
        [disabled]="isGuest() && isGuestRestrictedTab('bookings')"
        [class.guest-disabled-tab]="isGuest() && isGuestRestrictedTab('bookings')">
        <ion-icon name="calendar-outline"></ion-icon>
        <ion-label>Bookings</ion-label>
        @if (unreadCount() > 0) {
          <ion-badge color="danger">{{ unreadCount() > 9 ? '9+' : unreadCount() }}</ion-badge>
        }
      </ion-tab-button>

      <ion-tab-button tab="categories" [class.guest-tab]="isGuest()">
        <ion-icon name="grid-outline"></ion-icon>
        <ion-label>Categories</ion-label>
      </ion-tab-button>
      

      <ion-tab-button
        tab="messages"
        [disabled]="isGuest() && isGuestRestrictedTab('messages')"
        [class.guest-disabled-tab]="isGuest() && isGuestRestrictedTab('messages')">
        <ion-icon name="chatbubbles-outline"></ion-icon>
        <ion-label>Messages</ion-label>
        @if (unreadChatCount() > 0) {
          <ion-badge color="danger">{{ unreadChatCount() > 9 ? '9+' : unreadChatCount() }}</ion-badge>
        }
      </ion-tab-button>

      <ion-tab-button
        tab="profile"
        [disabled]="isGuest() && isGuestRestrictedTab('profile')"
        [class.guest-disabled-tab]="isGuest() && isGuestRestrictedTab('profile')">
        <ion-icon name="person-outline"></ion-icon>
        <ion-label>Profile</ion-label>
      </ion-tab-button>
    </ion-tab-bar>
  </ion-tabs>
